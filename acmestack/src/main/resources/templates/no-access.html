<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:attr="data-theme=${#strings.toLowerCase(ws.theme)}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>No pages available</title>
    <script th:src="@{/js/theme.js}"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-body">
<div class="login-card text-center">
    <div class="state-icon"><i class="bi bi-lock"></i></div>
    <h4>No pages available</h4>
    <p class="text-muted">Your role doesn't include access to any page yet.
        Ask an administrator to grant you permissions.</p>
    <form th:action="@{/logout}" method="post">
        <button class="btn btn-outline-secondary">Sign out</button>
    </form>
</div>
</body>
</html>
