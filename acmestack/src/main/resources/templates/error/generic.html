<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="page">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Error ' + ${status}">Error</title>
    <script th:src="@{/js/theme.js}"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-body">
<div class="login-card text-center"
     th:with="heading=${title ?: (error ?: 'Something went wrong')},
                text=${message ?: (status == 404 ? 'That page or item does not exist.' : 'Please try again. If it keeps happening, contact an administrator.')}">
    <div class="state-icon"><i class="bi bi-exclamation-triangle"></i></div>
    <h4><span th:text="${status}">500</span> · <span th:text="${heading}">Something went wrong</span></h4>
    <p class="text-muted" th:text="${text}">Message</p>
    <a class="btn btn-primary" th:href="@{/}">Back to start</a>
    <a class="btn btn-outline-secondary" href="javascript:history.back()">Go back</a>
</div>
</body>
</html>
