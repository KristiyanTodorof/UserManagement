<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, active, content)"
      th:attr="data-theme=${#strings.toLowerCase(ws.theme)}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · ' + ${ws.name}">AcmeStack</title>
    <script th:src="@{/js/theme.js}"></script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3EA%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@1.9.12/dist/htmx.min.js"></script>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <script>
        // send the CSRF token with every htmx request
        document.addEventListener('htmx:configRequest', function (e) {
            e.detail.headers[document.querySelector('meta[name=_csrf_header]').content] =
                document.querySelector('meta[name=_csrf]').content;
        });
        // show server-side refusals (422) and permission errors (403)
        document.addEventListener('htmx:responseError', function (e) {
            var s = e.detail.xhr.status;
            var text = e.detail.xhr.responseText;
            alert(s === 403 ? "You don't have permission to do that."
                : (s === 400 || s === 404 || s === 409 || s === 422) && text && text.length < 300 ? text
                    : 'Something went wrong.');
        });
    </script>
</head>
<body>
<div class="app">

    <div class="nav-backdrop" onclick="document.body.classList.remove('nav-open')"></div>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="brand"><i class="bi bi-boxes"></i> <span th:text="${ws.name}">AcmeStack</span></div>
        <nav>
            <a th:href="@{/dashboard}" th:classappend="${active == 'dashboard'} ? 'active'"
               sec:authorize="hasAuthority('reports.view')"><i class="bi bi-house"></i> Dashboard</a>
            <a th:href="@{/users}" th:classappend="${active == 'users'} ? 'active'"
               sec:authorize="hasAuthority('user_management.view')"><i class="bi bi-people"></i> Users</a>
            <a th:href="@{/chat}" th:classappend="${active == 'chat'} ? 'active'"
               sec:authorize="hasAuthority('chat.use')"><i class="bi bi-chat-dots"></i> Chat</a>
            <a th:href="@{/roles}" th:classappend="${active == 'roles'} ? 'active'"
               sec:authorize="hasAuthority('role_management.view')"><i class="bi bi-shield"></i> Roles</a>
            <a th:href="@{/permissions}" th:classappend="${active == 'permissions'} ? 'active'"
               sec:authorize="hasAuthority('permission_management.view')"><i class="bi bi-shield-check"></i> Permissions</a>
            <a th:href="@{/activity}" th:classappend="${active == 'activity'} ? 'active'"
               sec:authorize="hasAuthority('audit.view')"><i class="bi bi-clock-history"></i> Activity</a>
            <a th:href="@{/settings}" th:classappend="${active == 'settings'} ? 'active'"
               sec:authorize="hasAuthority('settings.view')"><i class="bi bi-gear"></i> Settings</a>
        </nav>
        <div class="upgrade">
            <div class="fw-semibold"><i class="bi bi-gem text-warning"></i> Upgrade to Pro</div>
            <small>Unlock advanced permissions, audit logs and more.</small>
            <button type="button" class="btn btn-light btn-sm w-100 mt-2">Upgrade</button>
        </div>
    </aside>

    <!-- Main area -->
    <div class="main">
        <header class="topbar">
            <button class="menu-btn" type="button" aria-label="Open menu"
                    onclick="document.body.classList.toggle('nav-open')"><i class="bi bi-list"></i></button>

            <form class="search" th:action="@{/users}" method="get"
                  sec:authorize="hasAuthority('user_management.view')">
                <i class="bi bi-search"></i>
                <input type="text" name="q" placeholder="Search users by name or email..." aria-label="Search users">
            </form>

            <div class="topbar-right">
                <a class="icon-btn" th:href="@{/activity(severity='HIGH',period='7')}"
                   sec:authorize="hasAuthority('audit.view')" title="High-severity events, last 7 days">
                    <i class="bi bi-bell"></i>
                </a>
                <div class="me" sec:authorize="isAuthenticated()">
                    <div class="avatar" th:classappend="'av-' + ${@fmt.colorIndex(#authentication.principal.name)}"
                         th:text="${#authentication.principal.initials}">AC</div>
                    <div class="me-text">
                        <div class="fw-semibold" th:text="${#authentication.principal.name}">Name</div>
                        <small class="text-muted" th:text="${#authentication.principal.roleName}">Role</small>
                    </div>
                    <form th:action="@{/logout}" method="post" class="ms-2">
                        <button class="btn btn-sm btn-outline-secondary" title="Sign out"><i class="bi bi-box-arrow-right"></i></button>
                    </form>
                </div>
            </div>
        </header>

        <main class="content" th:replace="${content}">content</main>
    </div>
</div>
</body>
</html>
