<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(${title}, ${active}, ~{::main})}">
<body>
<main class="content">
    <a class="small text-muted text-decoration-none" th:href="@{/chat}">← Back to chat</a>
    <h1 class="page-title">New chat</h1>
    <p class="page-subtitle">Pick someone to message.</p>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="table-card">
        <table class="table align-middle mb-0">
            <tbody>
            <tr th:each="u : ${candidates}">
                <td>
                    <div class="user-cell">
                        <div class="avatar" th:classappend="'av-' + ${@fmt.colorIndex(u.name)}"
                             th:text="${@fmt.initials(u.name)}">AB</div>
                        <div>
                            <div class="fw-semibold" th:text="${u.name}">Name</div>
                            <small class="text-muted" th:text="${u.email}">email</small>
                        </div>
                    </div>
                </td>
                <td><span class="pill role-pill" th:text="${u.role.name}">Role</span></td>
                <td class="text-end">
                    <form th:action="@{/chat/direct/{id}(id=${u.id})}" method="post">
                        <button class="btn btn-sm btn-outline-primary"><i class="bi bi-chat-dots"></i> Message</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(candidates)}">
                <td class="text-center text-muted py-4">There is nobody else to chat with yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
