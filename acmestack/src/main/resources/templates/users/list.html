<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(${title}, ${active}, ~{::main})}">
<body>
<main class="content">
    <div class="users-layout">

        <section class="users-main">
            <h1 class="page-title">User Management</h1>
            <p class="page-subtitle">Manage your team members, roles and permissions in one place.</p>

            <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

            <!-- stat cards -->
            <div class="stat-grid">
                <div class="stat-card">
                    <div class="stat-icon blue"><i class="bi bi-people"></i></div>
                    <div>
                        <div class="stat-label">Total Users</div>
                        <div class="stat-value">
                            <span th:text="${stats.total}">0</span>
                            <span class="trend" th:if="${stats.totalTrend() != null}" th:text="'↑ ' + ${stats.totalTrend()} + '%'"></span>
                        </div>
                        <div class="stat-note" th:text="'+' + ${stats.newThisWeek} + ' from last week'"></div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green"><i class="bi bi-lightning-charge"></i></div>
                    <div>
                        <div class="stat-label">Active Users</div>
                        <div class="stat-value" th:text="${stats.active}">0</div>
                        <div class="stat-note" th:text="${stats.activePct()} + '% of total users'"></div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon indigo"><i class="bi bi-shield"></i></div>
                    <div>
                        <div class="stat-label">Admins</div>
                        <div class="stat-value" th:text="${stats.admins}">0</div>
                        <div class="stat-note" th:text="${stats.adminPct()} + '% of total users'"></div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon sky"><i class="bi bi-bar-chart"></i></div>
                    <div>
                        <div class="stat-label">New This Week</div>
                        <div class="stat-value">
                            <span th:text="${stats.newThisWeek}">0</span>
                            <span class="trend" th:if="${stats.newTrend() != null}"
                                  th:text="${stats.newTrend() >= 0 ? '↑ +' : '↓ '} + ${stats.newTrend()} + '%'"></span>
                        </div>
                        <div class="stat-note">Compared to last week</div>
                    </div>
                </div>
            </div>

            <!-- toolbar -->
            <form class="toolbar" method="get" th:action="@{/users}">
                <input type="text" name="q" th:value="${q}" class="form-control" placeholder="Search users by name or email...">
                <select name="roleId" class="form-select" onchange="this.form.submit()">
                    <option value="">All Roles</option>
                    <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.name}"
                            th:selected="${r.id == roleId}"></option>
                </select>
                <select name="status" class="form-select" onchange="this.form.submit()">
                    <option value="">All Statuses</option>
                    <option th:each="s : ${statuses}" th:value="${s}"
                            th:text="${#strings.capitalize(#strings.toLowerCase(s))}"
                            th:selected="${s == status}"></option>
                </select>
                <select name="period" class="form-select" onchange="this.form.submit()">
                    <option value="all"  th:selected="${period == 'all'}">All time</option>
                    <option value="7"    th:selected="${period == '7'}">Last 7 days</option>
                    <option value="30"   th:selected="${period == '30'}">Last 30 days</option>
                    <option value="90"   th:selected="${period == '90'}">Last 90 days</option>
                </select>
                <a class="btn btn-primary text-nowrap" th:href="@{/users/new}"
                   sec:authorize="hasAuthority('user_management.create')"><i class="bi bi-plus-lg"></i> Add User</a>
            </form>

            <!-- table -->
            <div class="table-card">
                <table class="table align-middle mb-0">
                    <thead>
                    <tr><th>User</th><th>Role</th><th>Status</th><th>Last Active</th><th class="text-end">Actions</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${page.content}">
                        <td class="clickable" th:attr="hx-get=@{/users/{id}/panel(id=${u.id})}" hx-target="#panel">
                            <div class="user-cell">
                                <div class="avatar" th:classappend="'av-' + ${@fmt.colorIndex(u.name)}"
                                     th:text="${@fmt.initials(u.name)}">AB</div>
                                <div>
                                    <div class="fw-semibold" th:text="${u.name}">Name</div>
                                    <small class="text-muted" th:text="${u.email}">email</small>
                                </div>
                            </div>
                        </td>
                        <td><span class="pill role-pill" th:text="${u.role.name}">Role</span></td>
                        <td><span class="pill" th:classappend="'st-' + ${#strings.toLowerCase(u.status)}"
                                  th:text="${#strings.capitalize(#strings.toLowerCase(u.status))}">Active</span></td>
                        <td class="text-muted" th:text="${@fmt.ago(u.lastActiveAt)}">2 hours ago</td>
                        <td class="text-end">
                            <div class="row-actions">
                                <a class="btn btn-sm btn-outline-secondary" th:href="@{/users/{id}/edit(id=${u.id})}"
                                   sec:authorize="hasAuthority('user_management.edit')"><i class="bi bi-pencil"></i> Edit</a>
                                <form th:action="@{/users/{id}/delete(id=${u.id})}" method="post"
                                      onsubmit="return confirm('Delete this user?')"
                                      sec:authorize="hasAuthority('user_management.delete')">
                                    <button class="btn btn-sm btn-outline-danger" title="Delete"><i class="bi bi-trash"></i></button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${page.empty}"><td colspan="5" class="text-center text-muted py-4">No users found.</td></tr>
                    </tbody>
                </table>

                <div class="pager" th:if="${page.totalPages > 1}">
          <span class="text-muted"
                th:text="'Showing ' + (${page.number} * ${page.size} + 1) + '–' + (${page.number} * ${page.size} + ${page.numberOfElements}) + ' of ' + ${page.totalElements}"></span>
                    <div class="pager-links">
                        <a th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                           th:href="@{/users(q=${q},roleId=${roleId},status=${status},period=${period},page=${i})}"
                           th:classappend="${i == page.number} ? 'active'" th:text="${i + 1}">1</a>
                    </div>
                </div>
            </div>
        </section>

        <aside id="panel" class="side-panel"></aside>
    </div>
</main>
</body>
</html>
