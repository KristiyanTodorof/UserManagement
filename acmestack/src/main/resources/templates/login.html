<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · AcmeStack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-body">
<div class="login-card">
    <div class="brand text-center mb-4" style="color:#0f1f3d"><i class="bi bi-boxes"></i> AcmeStack</div>
    <h4 class="mb-1">Welcome back</h4>
    <p class="text-muted mb-4">Sign in to your workspace.</p>

    <div class="alert alert-danger py-2" th:if="${param.error}">Invalid email or password, or the account is not active.</div>
    <div class="alert alert-success py-2" th:if="${param.logout}">You have been signed out.</div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="username" class="form-control" autofocus required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Sign in</button>
    </form>
</div>
</body>
</html>
