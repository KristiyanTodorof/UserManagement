<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:attr="data-theme=${#strings.toLowerCase(ws.theme)}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Sign in · ' + ${ws.name}">Sign in</title>
    <script th:src="@{/js/theme.js}"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-body">
<div class="login-card">
    <div class="login-brand">
        <span class="brand-mark"><i class="bi bi-boxes"></i></span>
        <span th:text="${ws.name}">AcmeStack</span>
    </div>
    <h4 class="mb-1">Welcome back</h4>
    <p class="text-muted mb-4">Sign in to your workspace.</p>

    <div class="alert alert-danger py-2" th:if="${param.error}">Invalid email or password, or the account is not active.</div>
    <div class="alert alert-success py-2" th:if="${param.logout}">You have been signed out.</div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label" for="username">Email</label>
            <input type="email" id="username" name="username" class="form-control" autofocus required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Sign in</button>
    </form>
</div>
</body>
</html>
