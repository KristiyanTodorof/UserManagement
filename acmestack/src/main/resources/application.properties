spring.application.name=acmestack
# Database
spring.datasource.url=jdbc:mysql://localhost:3306/acmestack
spring.datasource.username=root
spring.datasource.password=

# Flyway owns the schema; Hibernate only verifies it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Thymeleaf: no cache while developing
spring.thymeleaf.cache=false

# Actuator: only the health endpoint, no details
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Chat
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.chat.upload-dir=${user.home}/acmestack-uploads
